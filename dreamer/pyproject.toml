[project]
name = "dreamer-drone"
version = "0.1.0"
description = "DreamerV3 training & deployment for the AI Grand Prix DCL drone racer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pymavlink>=2.4",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "torch>=2.2",       # CUDA build recommended (WSL /dev/dxg); CPU works for tests
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
